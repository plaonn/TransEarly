<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>TransEarly Options</title>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f9fafb;
      color: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 400px;
    }
    h1 {
      font-size: 1.5rem;
      margin-top: 0;
      margin-bottom: 1.5rem;
      text-align: center;
      color: #374151;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: #4b5563;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      box-sizing: border-box;
      margin-bottom: 1.5rem;
      font-size: 1rem;
      transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.5);
    }
    button {
      width: 100%;
      padding: 0.75rem;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease-in-out;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    #status {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.875rem;
      color: #10b981;
      min-height: 1.25rem;
    }
  </style>
  <script type="module" crossorigin src="/src/options.js"></script>
  <link rel="modulepreload" crossorigin href="/src/chunk.js">
</head>
<body>
  <div class="container">
    <h1>TransEarly Settings</h1>
    <div>
      <label for="apiKey">Google Translate API Key</label>
      <input type="text" id="apiKey" placeholder="Enter your API Key here">
    </div>
    <button id="saveBtn">Save Key</button>
    <div id="status"></div>
  </div>
</body>
</html>
